name: dotnet build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN_PERCENT: 60
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: src/ChessTrainerApp/package-lock.json
    - name: Install front-end dependencies
      working-directory: src/ChessTrainerApp
      run: npm ci
    - name: Restore dependencies
      run: dotnet restore ChessTrainer.slnx
    - name: Build
      run: dotnet build ChessTrainer.slnx -c Release --no-restore
    - name: Test
      run: dotnet test ChessTrainer.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*
    - name: Generate coverage report
      run: |
        reportgenerator \
          "-reports:TestResults/**/coverage.cobertura.xml" \
          "-targetdir:TestResults/CoverageReport" \
          "-reporttypes:Cobertura;MarkdownSummaryGithub;TextSummary" \
          "-assemblyfilters:-*.Test" \
          "-classfilters:-MjrChess.Trainer.Data.Migrations.*;-IngestionFunctions.DirectFunctionExecutor;-IngestionFunctions.FunctionExecutorAutoStartup;-IngestionFunctions.FunctionExecutorHostBuilderExtensions;-IngestionFunctions.FunctionMetadataProviderAutoStartup;-IngestionFunctions.GeneratedFunctionMetadataProvider;-IngestionFunctions.WorkerHostBuilderFunctionMetadataProviderExtension"
    - name: Publish coverage summary
      run: |
        cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        cat TestResults/CoverageReport/Summary.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Enforce minimum coverage
      run: |
        python - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        
        threshold = float(os.environ["COVERAGE_MIN_PERCENT"])
        tree = ET.parse("TestResults/CoverageReport/Cobertura.xml")
        line_rate = float(tree.getroot().attrib["line-rate"]) * 100.0
        print(f"Line coverage: {line_rate:.2f}% (minimum {threshold:.2f}%)")
        if line_rate < threshold:
            raise SystemExit(f"Coverage gate failed: {line_rate:.2f}% < {threshold:.2f}%")
        PY
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: TestResults/CoverageReport
