name: dotnet build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: src/ChessTrainerApp/package-lock.json
    - name: Install front-end dependencies
      working-directory: src/ChessTrainerApp
      run: npm ci
    - name: Restore dependencies
      run: dotnet restore ChessTrainer.sln
    - name: Build
      run: dotnet build ChessTrainer.sln -c Release --no-restore
    - name: Test
      run: dotnet test ChessTrainer.sln -c Release --no-build --verbosity normal
