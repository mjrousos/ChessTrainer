name: dotnet build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: src/ChessTrainerApp/package-lock.json
    - name: Install front-end dependencies
      working-directory: src/ChessTrainerApp
      run: npm ci
    - name: Restore dependencies
      run: dotnet restore ChessTrainer.slnx
    - name: Build
      run: dotnet build ChessTrainer.slnx -c Release --no-restore
    - name: Test
      run: dotnet test ChessTrainer.slnx -c Release --no-build --verbosity normal
