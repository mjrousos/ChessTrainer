              - The orchestrator launched only 1 model AND the final
                response explicitly states a single-model limitation
                (e.g., "_Reviewed by: claude-opus-4.7 (single-model: only
                one eligible family available)._").

            Score 0 (fail) if:
              - No task calls were made (orchestrator did the review
                solo without fanning out), OR
              - Multiple task calls were made but all used the same model
                family AND the response does not acknowledge the
                single-family limitation, OR
              - The trajectory shows fan-out but the final response is
                missing the _Reviewed by: line entirely.
      - type: completed
      - type: output-not-matches
        config:
          pattern: '(?i)fatal error|unhandled exception|stack trace|crashed|panic:'

  # ---------------------------------------------------------------------------
  # 3. Slash-command flavor. Tests terse `/review #N` phrasing with no leading
  #    instruction to use the skill; it should still route and gather PR data.
  # ---------------------------------------------------------------------------
  - name: slash-review-pr
