name: code-review
description: >
  Validates the code-review orchestration skill: it should trigger for PR and
  diff review requests, fan out to multiple code-review sub-agents with explicit
  models, gather PR/diff context, synthesize the review in the required format,
  and stay silent on explanation or implementation requests that are not reviews.
version: "1.0"
type: capability

# Root-level tags inherited by every stimulus (each stimulus may add its own).
tags:
  type: integration
  skill: code-review

config:
  # Reviews are expensive because the orchestrator fans out to sub-agents. Keep
  # the trial count lower than stockfish-cli while preserving repeated signal.
  runs: 3
  timeout: 10m
  executor: copilot-sdk
  model: claude-sonnet-4.6

environment:
  # Skill paths are relative to THIS eval YAML file.
  skills:
    - ../skills/code-review
  # Stage repo files into the trial workdir so review/diff/edit stimuli have
  # the actual repository to operate on. Without this, agents declined the
  # task with "the working directory only contains a SKILL.md file, with no
  # git repo, no diff..." Vally copies relative to THIS eval file's
  # directory, so `../../<path>` resolves from `.agents/evals/<path>` to
  # `<repo-root>/<path>`.
  #
  # We list specific entries (not `../../`) to avoid pulling in dot-prefixed
  # directories (`.agents/`, `.github/`, `.git/`) and ignored output trees
  # (`bin/`, `obj/`, `vally-results/`). The `commands:` step further scrubs
  # any bin/obj/node_modules that came along inside src/ or test/ from the
  # local checkout so trials are deterministic.
  files:
    - src: ../../ChessTrainer.sln
      dest: ChessTrainer.sln
    - src: ../../Directory.Build.props
      dest: Directory.Build.props
    - src: ../../Directory.Build.targets
      dest: Directory.Build.targets
    - src: ../../global.json
      dest: global.json
    - src: ../../rules.ruleset
      dest: rules.ruleset
    - src: ../../stylecop.json
      dest: stylecop.json
    - src: ../../AGENTS.md
      dest: AGENTS.md
    - src: ../../src/
      dest: src/
    - src: ../../test/
      dest: test/
  commands:
    # Scrub build artifacts and node_modules carried in from the local
    # checkout so trials are deterministic and the workdir stays small.
    - pwsh -NoProfile -Command "Get-ChildItem -Path . -Include bin,obj,node_modules -Directory -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue"
    # Initialize a minimal git repository so review stimuli that depend on
    # `git diff` / `git status` / `git diff main` have something to work
    # against. Without this the agents declined with "the working directory
    # is not a git repository". We create a baseline `main` branch with all
    # the staged files committed; stimuli that want a non-empty diff can
    # then stage/modify files themselves to produce one.
    - git init --initial-branch=main --quiet
    - git config user.email "vally-eval@example.com"
    - git config user.name "Vally Eval"
    - git add -A
    - git commit --quiet -m "baseline"
    # Create a feature branch with one new committed file. This gives
    # `pre-pr-diff-against-main` a real diff to review when the agent runs
    # `git diff main` from this branch. The change is small, plain ASCII,
    # and self-contained (a new file added) so review stimuli have an
    # unambiguous target.
    - git checkout -b feature/example-change --quiet
    - pwsh -NoProfile -Command "New-Item -Path src/ChessTrainerApp/app/example-banner.ts -ItemType File -Force -Value 'export const exampleBanner = `\"Welcome to the puzzle solver!`\";' | Out-Null"
    - git add src/ChessTrainerApp/app/example-banner.ts
    - git commit --quiet -m "Add example banner module"
    # Leave one file with unstaged modifications so `git status` reports
    # changes for `unstaged-changes-review`. We append a benign comment so
    # `git diff` shows real content; the file itself remains functional.
    # Wrapped in single-quoted YAML scalar because the inline content
    # contains a `: ` (colon-space) sequence which would otherwise get
    # parsed as a YAML mapping (Vally then fails with "child_process.exec
    # received Object").
    - 'pwsh -NoProfile -Command "Add-Content -Path src/ChessTrainerApp/Pages/About.razor -Value ''@* TODO: extend with author bio and contact info *@''"'

scoring:
  # Weights mirror stockfish-cli and are chosen so each grader is binding at
  # threshold: 0.9. Positive stimuli use 5 graders with total weight 8.5:
  #   - lose skill-invocation (2.0)  → 6.5/8.5 = 0.765
  #   - lose tool-calls       (1.5)  → 7.0/8.5 = 0.824
  #   - lose output-matches   (2.5)  → 6.0/8.5 = 0.706
  #   - lose prompt           (2.5)  → 6.0/8.5 = 0.706
  #   - lose output-not-match (1.5)  → 7.0/8.5 = 0.824
  #   - lose completed        (1.0)  → 7.5/8.5 = 0.882
  # All are < 0.9, so any single-grader failure fails the trial. Negative
  # stimuli use 5 graders as well (skill-invocation, tool-calls, prompt,
  # output-not-matches, completed), preserving the same binding math.
  weights:
    skill-invocation: 2.0
    tool-calls: 1.5
    output-not-matches: 1.5
    output-matches: 2.5
    prompt: 2.5
    completed: 1.0
  threshold: 0.9

# Reviews can require several agent turns: skill activation, parallel fan-out,
# reading sub-agent results, and synthesis. Bound both turns and tokens so a
# broken orchestrator cannot loop indefinitely.
constraints:
  max_turns: 20
  max_tokens: 6000

# -----------------------------------------------------------------------------
# Helper grader patterns used across should-invoke stimuli.
# Inlined per stimulus below (rather than using YAML anchors) to match the
# stockfish-cli eval style and keep Vally lint behavior predictable.
#
# Orchestration matcher:
#   required matcher A: task(agent_type=code-review, model=^gpt-)
#   required matcher B: task(agent_type=code-review, model=^(claude|gemini|mai)-)
#
# Vally's tool-calls grader treats each required matcher independently and a
# required matcher is satisfied by at least one completed call. Requiring one
# GPT-family reviewer and one non-GPT reviewer statically verifies at least two
# distinct model-family fan-out calls with explicit model arguments.
# -----------------------------------------------------------------------------

stimuli:
  # ---------------------------------------------------------------------------
  # 1. Standard PR review request. Tests natural routing, multi-model fan-out,
  #    PR context gathering via gh, and the required synthesized review footer.
  #    PR #49 exists in this repository and has a substantive UI theming diff.
  # ---------------------------------------------------------------------------
  - name: standard-pr-review
    timeout: 10m
    tags:
      tier: full
      area: response-quality
      cost: free
    prompt: >
      Please review PR #49 in this repository.
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: tool-calls
        config:
          required:
            # NOTE: previously had two ^task$ matchers with args.model filters
            # (one ^gpt-, one ^(claude|gemini|mai)-) to assert multi-family
            # fan-out. Vally's tool-calls grader silently ignores args:
            # (only name/command/path are honored — see tool-call-grader.js:8
            # ToolArgKeys). Replaced with a single name-only matcher; the
            # multi-model fan-out check is now done by a prompt LLM-judge
            # grader on each positive stimulus.
            - name: "^task$"
            - name: "^(bash|powershell|shell)$"
              command: '(?i)\bgh\s+pr\s+view\s+49\b'
            - name: "^(bash|powershell|shell)$"
              command: '(?i)\bgh\s+pr\s+diff\s+49\b'
      - type: output-matches
        config:
          pattern: '(?is)(?=.*_Reviewed by:)(?=.*(?:LGTM|Needs Human Review|Needs Changes|Reject|❌|⚠️|💡))'
      # Multi-model fan-out check (replaces the broken args.model tool-call
      # matchers — see note on ^task$ above). Verifies the orchestrator
      # actually launched sub-agents from at least 2 distinct model
      # families, which is mandatory per code-review/SKILL.md but cannot
      # be enforced by tool-calls graders alone.
      - type: prompt
        config:
          scoring: binary
          prompt: |
            The agent was asked to perform a code review. Per
            code-review/SKILL.md, a review is incomplete unless the
            orchestrator fanned out to >=2 sub-agents from DISTINCT model
            families (claude, gpt, gemini, mai) via the task tool. The
            single-model exception only applies if the environment has
            <2 eligible families — and in that case the agent must say
            so explicitly in the _Reviewed by: line.

            Inspect the trajectory's task tool calls (look for tool
            name == "task" with agent_type: code-review). Note the
            model argument on each.

            Score 1 (pass) if EITHER:
              - The orchestrator launched at least 2 task calls with
                models from distinct families (e.g., one claude-* and
                one gpt-*; or claude + gemini; or gpt + gemini), OR
              - The orchestrator launched only 1 model AND the final
                response explicitly states a single-model limitation
                (e.g., "_Reviewed by: claude-opus-4.7 (single-model: only
                one eligible family available)._").

            Score 0 (fail) if:
              - No task calls were made (orchestrator did the review
                solo without fanning out), OR
              - Multiple task calls were made but all used the same model
                family AND the response does not acknowledge the
                single-family limitation, OR
              - The trajectory shows fan-out but the final response is
                missing the _Reviewed by: line entirely.
      - type: completed
      - type: output-not-matches
        config:
          pattern: '(?i)fatal error|unhandled exception|stack trace|crashed|panic:'

  # ---------------------------------------------------------------------------
  # 2. Self-review before committing. Tests that local uncommitted diff review
  #    requests trigger the same orchestration shape, but gather context from
  #    git diff rather than GitHub PR commands.
  # ---------------------------------------------------------------------------
  - name: unstaged-changes-review
    timeout: 10m
    tags:
      tier: full
      area: response-quality
      cost: free
    prompt: >
      Can you review my unstaged changes before I commit?
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: tool-calls
        config:
          required:
            # NOTE: previously had two ^task$ matchers with args.model filters
            # (one ^gpt-, one ^(claude|gemini|mai)-) to assert multi-family
            # fan-out. Vally's tool-calls grader silently ignores args:
            # (only name/command/path are honored — see tool-call-grader.js:8
            # ToolArgKeys). Replaced with a single name-only matcher; the
