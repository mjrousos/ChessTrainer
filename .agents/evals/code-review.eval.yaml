  # ---------------------------------------------------------------------------
  # 4. Pre-PR sanity check. Tests review intent before a PR exists: the agent
  #    should compare the working branch against main and orchestrate reviewers.
  # ---------------------------------------------------------------------------
  - name: pre-pr-diff-against-main
    timeout: 10m
    tags:
      tier: full
      area: response-quality
      cost: free
    prompt: >
      I'm about to open a PR — can you review the diff against main?
    graders:
      - type: skill-invocation
        config:
          required: ["code-review"]
      - type: tool-calls
        config:
          required:
            # NOTE: previously had two ^task$ matchers with args.model filters
            # (one ^gpt-, one ^(claude|gemini|mai)-) to assert multi-family
            # fan-out. Vally's tool-calls grader silently ignores args:
